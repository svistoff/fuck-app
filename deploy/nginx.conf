# nginx для объединённого проекта fuck-app.us.
#
# ВАРИАНТ A (рекомендуется для SEO) — блог поддиректорией fuck-app.us/blog.
#   Нужны только два домена: fuck-app.us и content.fuck-app.us.
#   Блок "blog.fuck-app.us" ниже НЕ нужен — удалите его. A-запись blog не нужна.
#   В .env: BLOG_BASE_URL=https://fuck-app.us/blog, BLOG_HOST= (пусто).
#   Сертификат: certbot --nginx -d fuck-app.us -d www.fuck-app.us -d content.fuck-app.us
#
# ВАРИАНТ B — блог на поддомене blog.fuck-app.us (нужна A-запись blog и блок ниже).
#   В .env: BLOG_BASE_URL=https://blog.fuck-app.us, BLOG_HOST=blog.fuck-app.us.
#   Сертификат: добавьте -d blog.fuck-app.us.
#
# Два бэкенда: Node (сайт + блог) 127.0.0.1:8080, Python-завод 127.0.0.1:8000.
# Замените пути к сертификатам и /var/www/fuck-app на свои.

# ── HTTP → HTTPS ─────────────────────────────────────────────
# (для варианта A уберите blog.fuck-app.us из списка)
server {
  listen 80;
  server_name fuck-app.us www.fuck-app.us blog.fuck-app.us content.fuck-app.us;
  return 301 https://$host$request_uri;
}

# ── Основной сайт знакомств: fuck-app.us ─────────────────────
server {
  listen 443 ssl http2;
  server_name fuck-app.us www.fuck-app.us;

  ssl_certificate     /etc/letsencrypt/live/fuck-app.us/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/fuck-app.us/privkey.pem;

  client_max_body_size 12m;            # под загрузку фото анкет
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;

  # Фото анкет отдаём напрямую с диска
  location /uploads/ {
    alias /var/www/fuck-app/uploads/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    autoindex off;
  }

  # Внутренний API публикации блога НЕ выставляем наружу с основного домена.
  location = /internal/blog/publish { return 404; }

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# ── Блог: blog.fuck-app.us (ТОЛЬКО для варианта B; для A удалите) ────
server {
  listen 443 ssl http2;
  server_name blog.fuck-app.us;

  ssl_certificate     /etc/letsencrypt/live/fuck-app.us/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/fuck-app.us/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;

  location /uploads/ {
    alias /var/www/fuck-app/uploads/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    autoindex off;
  }

  # Приём статей из контент-завода. Открывать наружу не обязательно —
  # завод и Node на одной машине могут общаться по 127.0.0.1:8080. Если
  # ходите снаружи, оставьте доступным только с IP завода:
  #   location = /internal/blog/publish { allow <IP>; deny all; proxy_pass ...; }

  location / {
    proxy_pass http://127.0.0.1:8080;     # Node сам отдаёт блог по Host blog.fuck-app.us
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# ── Контент-завод: content.fuck-app.us (Python FastAPI) ──────
server {
  listen 443 ssl http2;
  server_name content.fuck-app.us;

  ssl_certificate     /etc/letsencrypt/live/fuck-app.us/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/fuck-app.us/privkey.pem;

  client_max_body_size 4m;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # Завод закрыт логином/паролем в самом приложении (CONTENT_ADMIN_*).
  # Хотите второй рубеж — раскомментируйте HTTP Basic:
  #   auth_basic "Content Radar";
  #   auth_basic_user_file /etc/nginx/.htpasswd-content;   # htpasswd -c ...

  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
