# Пример конфигурации nginx. Замени example.ru на свой домен и пути к сертификатам.
# Один процесс Node слушает 127.0.0.1:8080, nginx терминирует HTTPS и проксирует всё на него.

server {
  listen 80;
  server_name example.ru www.example.ru;
  # Редирект на HTTPS
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name example.ru www.example.ru;

  ssl_certificate     /etc/letsencrypt/live/example.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;

  client_max_body_size 12m;            # под загрузку фото
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;

  # Фото отдаём напрямую с диска, мимо Node (быстрее)
  location /uploads/ {
    alias /var/www/example.ru/uploads/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    autoindex off;
  }

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
