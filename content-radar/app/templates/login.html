<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — Content Radar</title><link rel="stylesheet" href="/static/app.css"></head>
<body><main style="max-width:380px;margin:8vh auto;padding:0 16px">
<h1>Content Radar</h1>
<p class="hint">Внутренний контент-завод. Доступ только по паролю.</p>
{% if error_message %}<p class="error" style="color:#c0392b">{{ error_message }}</p>{% endif %}
{% if no_password %}<p class="error" style="color:#c0392b">Пароль не задан: укажите CONTENT_ADMIN_PASSWORD в .env, иначе вход недоступен.</p>{% endif %}
<form method="post" action="/login">
  <p><label>Логин<br><input name="username" autocomplete="username" required style="width:100%"></label></p>
  <p><label>Пароль<br><input name="password" type="password" autocomplete="current-password" required style="width:100%"></label></p>
  <button type="submit">Войти</button>
</form>
</main></body></html>
